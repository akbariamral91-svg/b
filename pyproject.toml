[project]
name = "getbetter"
version = "4.1.1"
description = "Get Better — برنامه‌ریز آمادگی آزمون (آفلاین، جلالی)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["flet==0.28.3", "flet-local-notifications"]

[tool.flet]
product = "Get Better"
org = "com.getbetter"
company = "Get Better"
copyright = "Copyright (C) 2026 Get Better"

[tool.flet.splash]
color = "#F4F6FD"
dark_color = "#060A18"

[tool.flet.android]
split_per_abi = false

[tool.flet.android.permission]
"android.permission.POST_NOTIFICATIONS" = true
"android.permission.WAKE_LOCK" = true
